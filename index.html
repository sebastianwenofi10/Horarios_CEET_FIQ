                const uniqueCursos = new Set();
                const bloques = [];
                const diasMap = {};

                seccionesAgregadas.forEach(sec => {
                    if (!uniqueCursos.has(sec.cursoId)) { 
                        creditos += (sec.creditos || 4); 
                        uniqueCursos.add(sec.cursoId); 
                    }
                    sec.horarios.forEach(h => {
                        const start = timeToMins(h.inicio);
                        const end = timeToMins(h.fin);
                        minsClase += (end - start);
                        bloques.push({ dia: h.dia, inicio: start, fin: end });
                        
                        if(!diasMap[h.dia]) diasMap[h.dia] = [];
                        diasMap[h.dia].push({ start, end });
                    });
                });

                for(let i=0; i < bloques.length; i++){
                    for(let j=i+1; j < bloques.length; j++){
                        const b1 = bloques[i], b2 = bloques[j];

                                                'bg-[#f0fdf4] border-[#10b981] text-[#064e3b]', 
                                                'bg-[#fdf2f8] border-[#ec4899] text-[#831843]', 
                                                'bg-[#fffbeb] border-[#f59e0b] text-[#78350f]', 
                                                'bg-[#f5f3ff] border-[#8b5cf6] text-[#4c1d95]'
                                            ];
                                            const color = seccion.itemType === 'LAB' ? 'bg-[#f8fafc] border-[#64748b] text-[#334155]' : colores[sIdx % colores.length];

                                            return seccion.horarios.map((horario, hIdx) => {
                                                const colIndex = diasSemana.indexOf(horario.dia);
                                                if (colIndex === -1) return null;
                                                const startMin = timeToMins(horario.inicio);
                                                const offsetTop = startMin - (HORA_INICIO * 60);
                                                const duration = timeToMins(horario.fin) - startMin;

                                                return (
                                                    <div 
                                                        key={`${sIdx}-${hIdx}`}
                                                        className={`absolute class-block rounded-xl border-l-[4px] p-2 flex flex-col items-center justify-center overflow-hidden z-20 text-center ${color}`}
                                                        style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 64px) / 6 - 8px)`, left: `calc(64px + ((100% - 64px) / 6) * ${colIndex} + 4px)` }}
                                                    >
                                                        <span className="font-black text-[10px] leading-tight mb-1 uppercase tracking-tight">{seccion.nombreCurso}</span>
                                                        <span className="font-bold text-[9px] opacity-80 mb-1">
                                                            {seccion.codigo} • Sec. {seccion.seccion}
                                                        </span>
                                                        
                                                        <div className="mt-auto flex flex-col items-center gap-1 w-full">
                                                            <div className="font-black bg-white/70 px-2 py-0.5 rounded shadow-sm text-[9px] flex items-center justify-center gap-1 border border-black/5 w-max">
                                                                {horario.aula} <span className="opacity-50">|</span> <span>{horario.tipo}</span>
                                                            </div>
                                                            <span className="text-[9px] font-bold flex items-center gap-1 opacity-90"><i className="fa-regular fa-clock"></i> {horario.inicio} - {horario.fin}</span>
                                                        </div>
                                                    </div>
                                                )
                                            });
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <footer className="w-full shrink-0 flex flex-col items-center justify-center pt-4 pb-6 mt-2 relative overflow-hidden" style={{backgroundColor: '#0f172a'}}>
                        <div className="globe-container">
                            <div className="globe">
                                <div className="ring"></div><div className="ring"></div><div className="ring"></div>
                                <div className="ring"></div><div className="ring"></div><div className="ring"></div>
                                <div className="ring"></div>
                            </div>
                        </div>
                        <div className="creator-text">C R E A D O &nbsp; P O R &nbsp; S E B A S T I A N</div>
                        <div className="copyright-text">© 2026 UNAC - Integración Estudiantil. Todos los derechos reservados.</div>
                    </footer>

                    <div ref={hiddenExportRef} className="bg-white" style={{width: '1400px', position: 'absolute', top: 0, left: '-20000px', padding: '50px', fontFamily: "'Inter', sans-serif", zIndex: -9999}}>
                        <div style={{position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%) rotate(-45deg)', fontSize: '130px', fontWeight: '900', color: 'rgba(59, 130, 246, 0.03)', whiteSpace: 'nowrap', zIndex: '0', pointerEvents: 'none', letterSpacing: '10px'}}>
                            CREADO POR SEBASTIAN
                        </div>

                        <div style={{display: 'flex', alignItems: 'center', justifyItems: 'space-between', justifyContent: 'space-between', borderBottom: '5px solid #1e40af', paddingBottom: '25px', marginBottom: '25px', position: 'relative', zIndex: '1'}}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '25px'}}>
                                <div style={{width: '80px', height: '80px', backgroundColor: '#eff6ff', borderRadius: '20px', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid #bfdbfe'}}>
                                    <i className="fa-solid fa-atom" style={{fontSize: '40px', color: '#3b82f6'}}></i>
                                </div>
                                <div>
                                    <h1 style={{margin: '0 0 5px 0', fontSize: '32px', color: '#0f172a', fontWeight: '900', letterSpacing: '-0.5px'}}>CEET FIQ Centro de Estudios <span style={{color: '#1e40af'}}>María Estela Toledo</span></h1>
                                    <p style={{margin: '0', fontSize: '18px', color: '#3b82f6', fontWeight: '800', textTransform: 'uppercase', letterSpacing: '1px'}}>Programación Horaria Oficial 2026-B</p>
                                </div>
                            </div>
                            <div style={{textAlign: 'right'}}>
                                <p style={{margin: '0 0 8px 0', fontSize: '16px', color: '#1e40af', fontStyle: 'italic', fontWeight: 'bold'}}>"Crecemos juntos, aprendemos mejor"</p>
                                <p style={{margin: '0', fontSize: '13px', color: '#64748b', fontWeight: '600', backgroundColor: '#f1f5f9', padding: '6px 12px', borderRadius: '8px', display: 'inline-block'}}>Generado: {new Date().toLocaleDateString()}</p>
                            </div>
                        </div>

                        <div style={{display: 'flex', gap: '20px', marginBottom: '25px', position: 'relative', zIndex: '1'}}>
                            <div style={{backgroundColor: '#eff6ff', border: '1px solid #bfdbfe', padding: '12px 25px', borderRadius: '12px', fontWeight: '800', color: '#1e40af', fontSize: '16px', display: 'flex', alignItems: 'center', gap: '10px'}}>
                                <i className="fa-solid fa-award"></i> Total Créditos: {totalCreditos} / {MAX_CREDITOS}
                            </div>
                            <div style={{backgroundColor: '#f8fafc', border: '1px solid #e2e8f0', padding: '12px 25px', borderRadius: '12px', fontWeight: '800', color: '#475569', fontSize: '16px', display: 'flex', alignItems: 'center', gap: '10px'}}>
                                <i className="fa-solid fa-book-open"></i> Cursos Matriculados: {new Set(seccionesAgregadas.map(s=>s.cursoId)).size}
                            </div>
                        </div>

                        <div style={{border: '3px solid #e2e8f0', borderRadius: '16px', overflow: 'hidden', backgroundColor: 'white', position: 'relative', zIndex: '1', boxShadow: '0 10px 30px rgba(0,0,0,0.05)'}}>
                            <div style={{display: 'flex', backgroundColor: '#f8fafc', borderBottom: '3px solid #e2e8f0'}}>
                                <div style={{width: '70px', padding: '18px 0', textAlign: 'center', fontWeight: '900', color: '#64748b', fontSize: '13px', letterSpacing: '1px'}}>HORA</div>
                                {diasSemana.map(d => <div key={d} style={{flex: 1, padding: '18px 0', textAlign: 'center', fontWeight: '900', color: '#0f172a', fontSize: '15px', borderLeft: '2px solid #e2e8f0', textTransform: 'uppercase'}}>{d}</div>)}
                            </div>
                            <div style={{position: 'relative', height: `${TOTAL_HORAS * 60}px`}}>
                                <div className="absolute inset-0 flex">
                                    <div style={{width: '70px', borderRight: '2px solid #e2e8f0', backgroundColor: '#f8fafc'}}></div>
                                    {diasSemana.map((_, i) => <div key={i} style={{flex: 1, borderRight: '1px solid #f1f5f9', backgroundImage: 'linear-gradient(to bottom, #f1f5f9 1px, transparent 1px)', backgroundSize: '100% 60px'}}></div>)}
                                </div>
                                <div className="absolute top-0 left-0" style={{width: '70px', textAlign: 'center', fontSize: '13px', color: '#475569', fontWeight: '800'}}>
                                    {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                        <div key={i} style={{height: '60px', position: 'relative', borderBottom: '1px solid #e2e8f0'}}>
                                            <span style={{position: 'absolute', top: '-9px', left: 0, width: '100%', backgroundColor: 'white'}}>{formatHourLine(i + HORA_INICIO)}</span>
                                        </div>
                                    ))}
                                </div>
                                
                                {seccionesAgregadas.map((seccion, sIdx) => {
                                    const colores = [
                                        {bg: '#eff6ff', br: '#3b82f6', txt: '#1e40af'},
                                        {bg: '#f0fdf4', br: '#10b981', txt: '#166534'},
                                        {bg: '#fdf2f8', br: '#ec4899', txt: '#9d174d'},
                                        {bg: '#fffbeb', br: '#f59e0b', txt: '#92400e'},
                                        {bg: '#f5f3ff', br: '#8b5cf6', txt: '#5b21b6'}
                                    ];
                                    const c = seccion.itemType === 'LAB' ? {bg: '#f8fafc', br: '#64748b', txt: '#334155'} : colores[sIdx % colores.length];

                                    return seccion.horarios.map((horario, hIdx) => {
                                        const colIndex = diasSemana.indexOf(horario.dia);
                                        const startMin = timeToMins(horario.inicio);
                                        const offsetTop = startMin - (HORA_INICIO * 60);
                                        const duration = timeToMins(horario.fin) - startMin;

                                        return (
                                            <div 
                                                key={`exp-${sIdx}-${hIdx}`}
                                                style={{ position: 'absolute', top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 70px) / 6 - 12px)`, left: `calc(70px + ((100% - 70px) / 6) * ${colIndex} + 6px)`, backgroundColor: c.bg, borderLeft: `6px solid ${c.br}`, borderRadius: '12px', padding: '12px', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center', boxShadow: '0 4px 6px rgba(0,0,0,0.05)' }}
                                            >
                                                <span style={{fontWeight: '900', color: '#0f172a', fontSize: '13px', marginBottom: '6px', textTransform: 'uppercase', lineHeight: '1.2'}}>{seccion.nombreCurso}</span>
                                                <span style={{fontWeight: '800', color: c.txt, fontSize: '11px', marginBottom: '6px'}}>
                                                    {seccion.codigo} • Sec. {seccion.seccion}
                                                </span>
                                                <span style={{fontSize: '11px', fontWeight: '700', color: '#475569', marginBottom: '8px'}}>{horario.docente}</span>
                                                <div style={{display: 'flex', gap: '8px', alignItems: 'center', justifyContent: 'center'}}>
                                                    <span style={{fontSize: '11px', fontWeight: '900', color: c.txt, backgroundColor: 'white', padding: '3px 8px', borderRadius: '6px', border: `1px solid ${c.br}40`}}>
                                                        {horario.aula} | {horario.tipo}
                                                    </span>
                                                    <span style={{fontSize: '11px', fontWeight: '800', color: '#ef4444'}}>
                                                        <i className="fa-regular fa-clock"></i> {horario.inicio}-{horario.fin}
                                                    </span>
                                                </div>
                                            </div>
                                        )
                                    });
                                })}
                            </div>
                        </div>
                        
                        <div style={{marginTop: '30px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '2px solid #e2e8f0', paddingTop: '20px', position: 'relative', zIndex: '1'}}>
                            <p style={{margin: '0', fontSize: '14px', color: '#94a3b8', fontWeight: '600'}}>© 2026 UNAC - Todos los derechos reservados.</p>
                            <p style={{margin: '0', fontSize: '18px', color: '#3b82f6', fontWeight: '900', letterSpacing: '3px'}}>CREADO POR SEBASTIAN <i className="fa-solid fa-code" style={{marginLeft: '8px', color: '#60a5fa'}}></i></p>
                        </div>

                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
